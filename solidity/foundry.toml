[profile.default]
src = "contracts"
test = "test-foundry"
out = "foundry-out"
cache_path = "cache-foundry"
libs = ["lib", "node_modules"]
solc_version = "0.8.30"
optimizer = true
optimizer_runs = 1
via_ir = true
# Emit storage layout in the build output so `forge inspect <C> storageLayout`
# works. Without this, forge 1.0.0-nightly's inspect returns "Could not get
# storage layout", and StorageLayoutSnapshot.t.sol then silently PASSES (its
# assertion only checks the output doesn't contain "MISMATCH", which an error
# string doesn't) — a false green that hid the layout regression guard being
# disabled. See scripts/check-storage-layout.js.
extra_output = ["storageLayout"]
# We don't want Foundry to compile the Truffle JS tests or scripts.
# Match the Truffle/Hardhat target: only the contracts/ tree + the new test-foundry/ tree.
auto_detect_remappings = false
fs_permissions = [{ access = "read", path = "./" }]
# ffi enabled for StorageLayoutSnapshot.t.sol which shells out to node to compare
# storage-layout goldens. Intentional — the test is only checking layouts, not
# running untrusted code.
ffi = true

[fuzz]
# Tight memory budget on the dev machine; 1000 runs per fuzz test by default.
runs = 1000

[invariant]
runs = 64
depth = 32
fail_on_revert = false
